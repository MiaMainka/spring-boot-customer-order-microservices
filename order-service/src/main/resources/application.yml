server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mariadb://localhost:3306/order_db
    username: shop
    password: shop
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.hibernate.SQL: debug